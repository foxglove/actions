# Shared Checkov defaults for Foxglove reusable workflows.
# Consumers may commit a root checkov.yml to override paths/skips per repo.
#
# Docs: docs/checkov.md
#
# soft-fail is also set on the GitHub Action inputs so CI stays green while
# findings are reported. Flip that only when you are ready to enforce.

framework:
  - terraform
  - terraform_plan
  - helm
  - kubernetes

# Download public Terraform modules so graph checks see real resources.
download-external-modules: true

# --- Noise tuning (leave commented for a full-open first pass) ---
#
# skip-check:
#   - CKV_AWS_144   # example: skip a specific check ID
#
# skip-path:
#   - .*/\.terraform/.*
#   - charts/.*/targets/.*
#
# soft-fail-on:
#   - LOW
#   - MEDIUM
#
# hard-fail-on:
#   - CRITICAL
#
# baseline: .checkov.baseline
#   # Generate with: checkov -d . --create-baseline
#   # Then only NEW failures (vs baseline) are reported.
