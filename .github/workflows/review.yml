name: PR Review

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: true

concurrency:
  group: claude-review-${{ github.repository }}-${{ github.head_ref }}-${{ github.event.action }}
  cancel-in-progress: true

jobs:
  claude:
    if: >-
      github.event.pull_request != null &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout project repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout workflow repository
        uses: actions/checkout@v6
        with:
          repository: foxglove/actions
          path: .foxglove-actions

      - name: Prepare review configuration
        id: config
        shell: bash
        run: |
          prompt_file=".foxglove-actions/prompts/review.md"
          if [ ! -f "$prompt_file" ]; then
            echo "Missing required review prompt file: $prompt_file" >&2
            exit 1
          fi

          {
            echo "prompt<<PROMPT_EOF"
            echo "CONTEXT:"
            echo "  repo: ${REPO}"
            echo "  pr_number: ${PR_NUMBER}"
            echo "  base_branch: ${BASE_REF}"
            echo "  is_draft: ${IS_DRAFT}"
            echo "  bot_login: claude[bot]"
            echo ""
            cat "$prompt_file"
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

          allowed_tools=(
            "Read"
            "Glob"
            "Grep"
            "mcp__github__pull_request_read"
            "mcp__github__pull_request_review_write"
            "mcp__github__add_comment_to_pending_review"
            "mcp__github__add_reply_to_pull_request_comment"
            "mcp__github__get_pull_request"
            "mcp__github__get_pull_request_files"
            "mcp__github__get_pull_request_review_comments"
            "mcp__github__get_pull_request_reviews"
            "mcp__github__create_pending_pull_request_review"
            "mcp__github__add_comment_to_pending_pull_request_review"
            "mcp__github__submit_pending_pull_request_review"
            "Bash(yarn:*)"
            "Bash(git diff:*)"
            "Bash(git fetch:*)"
            "Bash(git lfs:*)"
            "Bash(git log:*)"
            "Bash(git show:*)"
            "Bash(gh api:*)"
            "Bash(gh pr diff:*)"
            "Bash(gh pr view:*)"
            "Bash(python3:*)"
            "Bash(python:*)"
          )
          tools_csv=$(IFS=,; echo "${allowed_tools[*]}")

          {
            echo "claude-args<<ARGS_EOF"
            echo "--model claude-opus-4-6"
            echo "--allowedTools \"${tools_csv}\""
            echo "ARGS_EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}

      - name: Clean up prior reviews
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            for (const review of reviews) {
              const reviewerLogin = review.user?.login;
              if (reviewerLogin !== "claude[bot]" || review.state !== "PENDING") {
                continue;
              }

              try {
                await github.rest.pulls.deletePendingReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  review_id: review.id,
                });
                core.info(`Deleted pending review ${review.id} from ${reviewerLogin}`);
              } catch (error) {
                const message = error instanceof Error ? error.message : String(error);
                core.warning(`Failed to delete pending review ${review.id} from ${reviewerLogin}: ${message}`);
              }
            }

      - name: Run Claude review
        id: review
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: false
          use_sticky_comment: false
          allowed_bots: cursor[bot]
          prompt: ${{ steps.config.outputs.prompt }}
          claude_args: ${{ steps.config.outputs.claude-args }}

      - name: Retry Claude review on failure
        if: steps.review.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: false
          use_sticky_comment: false
          allowed_bots: cursor[bot]
          prompt: ${{ steps.config.outputs.prompt }}
          claude_args: ${{ steps.config.outputs.claude-args }}
