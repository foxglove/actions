name: PR Review

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: true

concurrency:
  group: claude-review-${{ github.repository }}-${{ github.head_ref }}-${{ github.event.action }}
  cancel-in-progress: true

jobs:
  claude:
    if: >-
      github.event.pull_request != null &&
      github.actor != 'dependabot[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-claude-review')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLAUDE_ALLOWED_TOOLS: "Read,Glob,Grep,mcp__github__pull_request_read,mcp__github__pull_request_review_write,mcp__github__add_comment_to_pending_review,mcp__github__add_reply_to_pull_request_comment,mcp__github__get_pull_request,mcp__github__get_pull_request_files,mcp__github__get_pull_request_review_comments,mcp__github__get_pull_request_reviews,mcp__github__create_pending_pull_request_review,mcp__github__add_comment_to_pending_pull_request_review,mcp__github__submit_pending_pull_request_review,Bash(yarn:*),Bash(git diff:*),Bash(git fetch:*),Bash(git lfs:*),Bash(git log:*),Bash(git show:*),Bash(gh api:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(python3:*),Bash(python:*)"
    permissions:
      actions: read
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout project repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout workflow repository
        uses: actions/checkout@v6
        with:
          repository: foxglove/actions
          path: .foxglove-actions

      - name: Build Claude inputs
        id: claude-inputs
        shell: bash
        run: |
          prompt_file=".foxglove-actions/prompts/review.md"
          if [ ! -f "$prompt_file" ]; then
            echo "Missing required review prompt file: $prompt_file" >&2
            exit 1
          fi

          {
            echo "prompt<<EOF"
            cat <<'PROMPT_HEADER'
            CONTEXT:
              repo: ${{ github.repository }}
              pr_number: ${{ github.event.pull_request.number }}
              base_branch: ${{ github.event.pull_request.base.ref }}
              is_draft: ${{ github.event.pull_request.draft }}
              bot_login: claude[bot]

            PROMPT_HEADER
            cat "$prompt_file"
            echo "EOF"

            echo "claude_args<<EOF"
            echo "--model claude-opus-4-6"
            echo "--allowedTools \"${CLAUDE_ALLOWED_TOOLS}\""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Clean up prior reviews
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            for (const review of reviews) {
              const reviewerLogin = review.user?.login;
              if (reviewerLogin !== "claude[bot]" || review.state !== "PENDING") {
                continue;
              }

              try {
                await github.rest.pulls.deletePendingReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  review_id: review.id,
                });
                core.info(`Deleted pending review ${review.id} from ${reviewerLogin}`);
              } catch (error) {
                const message = error instanceof Error ? error.message : String(error);
                core.warning(`Failed to delete pending review ${review.id} from ${reviewerLogin}: ${message}`);
              }
            }

      - name: Run Claude review (attempt 1)
        id: attempt1
        continue-on-error: true
        uses: anthropics/claude-code-action@v1.0.88
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: false
          use_sticky_comment: false
          allowed_bots: cursor[bot]

          prompt: ${{ steps.claude-inputs.outputs.prompt }}
          claude_args: ${{ steps.claude-inputs.outputs.claude_args }}

      - name: Run Claude review (attempt 2)
        id: attempt2
        if: steps.attempt1.outcome == 'failure'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1.0.88
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: false
          use_sticky_comment: false
          allowed_bots: cursor[bot]

          prompt: ${{ steps.claude-inputs.outputs.prompt }}
          claude_args: ${{ steps.claude-inputs.outputs.claude_args }}

      - name: Run Claude review (attempt 3)
        id: attempt3
        if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1.0.88
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: false
          use_sticky_comment: false
          allowed_bots: cursor[bot]

          prompt: ${{ steps.claude-inputs.outputs.prompt }}
          claude_args: ${{ steps.claude-inputs.outputs.claude_args }}

      - name: Verify success
        if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure' && steps.attempt3.outcome == 'failure'
        run: |
          echo "Claude review failed after 3 attempts."
          exit 1
