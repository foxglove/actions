name: PR Review

on:
  workflow_call:
    inputs:
      beefcake-dispatch-url:
        description: >-
          Opt-in. The dispatch URL of beefcake, a local reviewer to offer the review to first.
          Requires the TAILSCALE_OAUTH_* secrets.
        type: string
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      TAILSCALE_OAUTH_CLIENT_ID:
        required: false
      TAILSCALE_OAUTH_SECRET:
        required: false
      # Numeric GitHub App id for foxglove-beefcake. Callers pass this when the
      # cloud path should post as foxglove-beefcake[bot]. Beefcake acceptance
      # does not read it. A missing or unusable value does not fail the job.
      BEEFCAKE_APP_ID:
        required: false
      # PEM private key for that App. Callers pass this with BEEFCAKE_APP_ID.
      BEEFCAKE_APP_PRIVATE_KEY:
        required: false

concurrency:
  group: beefcake-review-${{ github.repository }}-${{ github.head_ref }}-${{ github.event.action }}
  cancel-in-progress: true

jobs:
  beefcake:
    if: >-
      github.event.pull_request != null &&
      github.actor != 'dependabot[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-claude-review')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.beefcake-dispatch-url != '' && github.event.pull_request.head.repo.full_name == github.repository && 50 || 30 }}
    env:
      CLAUDE_ALLOWED_TOOLS: "Read,Glob,Grep,mcp__github__pull_request_read,mcp__github__pull_request_review_write,mcp__github__add_comment_to_pending_review,mcp__github__get_pull_request,mcp__github__get_pull_request_files,mcp__github__get_pull_request_review_comments,mcp__github__get_pull_request_reviews,mcp__github__get_issue_comments,mcp__github__create_pending_pull_request_review,mcp__github__submit_pending_pull_request_review,Bash(yarn:*),Bash(git diff:*),Bash(git fetch:*),Bash(git lfs:*),Bash(git log:*),Bash(git show:*),Bash(gh api:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(python3:*),Bash(python:*),Bash(node:*)"
    permissions:
      actions: read
      contents: read
      pull-requests: write
      id-token: write

    steps:
      # Offer the review to beefcake first. A decline or failure falls through to the review below.
      - name: Join the tailnet
        id: tailnet
        if: inputs.beefcake-dispatch-url != '' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        timeout-minutes: 2
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci
          timeout: 30s
          retry: 1

      - name: Hand the review to beefcake
        id: beefcake
        if: steps.tailnet.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        env:
          DISPATCH_URL: ${{ inputs.beefcake-dispatch-url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          id_token="$(curl -sS --fail --max-time 10 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=beefcake-review" | jq -r '.value // empty')"
          if [ -z "$id_token" ]; then
            echo "::notice::Could not get an OIDC token for beefcake, so the review runs here."
            exit 0
          fi
          request="$(jq -n --argjson pr "$PR_NUMBER" --arg headRef "$HEAD_REF" --arg headSha "$HEAD_SHA" \
            --arg baseRef "$BASE_REF" --argjson isDraft "$IS_DRAFT" \
            '{pr: $pr, headRef: $headRef, headSha: $headSha, baseRef: $baseRef, isDraft: $isDraft}')"
          if ! response="$(curl -sS --fail-with-body --max-time 10 \
            -H "Authorization: Bearer $id_token" -H 'Content-Type: application/json' \
            --data "$request" "$DISPATCH_URL")"; then
            echo "::notice::Beefcake did not take this review, so it runs here. $response"
            exit 0
          fi
          url="$(jq -r '.url // empty' <<< "$response" 2>/dev/null || true)"
          review_path="$(jq -r '.reviewPath // empty' <<< "$response" 2>/dev/null || true)"
          if [ -z "$url" ] || [ -z "$review_path" ]; then
            echo "::notice::Beefcake gave no session URL, so the review runs here. $response"
            exit 0
          fi
          echo "Beefcake is reviewing this commit: $url" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "review_url=$(sed -E 's#^(https?://[^/]+).*#\1#' <<< "$DISPATCH_URL")$review_path" >> "$GITHUB_OUTPUT"
          echo "accepted=true" >> "$GITHUB_OUTPUT"

      - name: Follow the beefcake review
        id: follow
        if: steps.beefcake.outputs.accepted == 'true'
        continue-on-error: true
        timeout-minutes: 20
        env:
          REVIEW_URL: ${{ steps.beefcake.outputs.review_url }}
          FOLLOW_SECONDS: 900
          SILENCE_SECONDS: 180
        run: |
          token=""
          token_at=-1000
          refresh_token() {
            if [ $((SECONDS - token_at)) -ge 120 ]; then
              fresh="$(curl -sS --fail --max-time 10 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=beefcake-review" | jq -r '.value // empty' || true)"
              if [ -n "$fresh" ]; then
                token="$fresh"
                token_at=$SECONDS
              fi
            fi
            [ -n "$token" ]
          }
          finished=false
          trap '[ "$finished" = true ] || curl -sS --max-time 10 -X POST -H "Authorization: Bearer $token" "$REVIEW_URL/cancel" > /dev/null || true' EXIT
          seen=0
          last_ok=$SECONDS
          deadline=$((SECONDS + FOLLOW_SECONDS))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! refresh_token; then
              echo "::warning::Could not get an OIDC token for beefcake, so the review runs here."
              exit 0
            fi
            if progress="$(curl -sS --fail --max-time 10 -H "Authorization: Bearer $token" "$REVIEW_URL?after=$seen")" &&
              status="$(jq -r '.status // empty' <<< "$progress" 2>/dev/null)" && [ -n "$status" ]; then
              last_ok=$SECONDS
              jq -r '.lines[]?' <<< "$progress" || true
              seen="$(jq -r '.total // 0' <<< "$progress")"
              case "$status" in
                posted)
                  jq -r '.posted | "Posted the review: \(.comments) comments, \(.replies) replies, \(.resolved) resolved threads."' \
                    <<< "$progress" | tee -a "$GITHUB_STEP_SUMMARY" || true
                  echo "done=true" >> "$GITHUB_OUTPUT"
                  echo "posted=true" >> "$GITHUB_OUTPUT"
                  finished=true
                  exit 0
                  ;;
                superseded)
                  echo "A newer commit replaced this review." | tee -a "$GITHUB_STEP_SUMMARY"
                  echo "done=true" >> "$GITHUB_OUTPUT"
                  finished=true
                  exit 0
                  ;;
                failed | cancelled)
                  echo "::warning::The beefcake review ended as $(jq -r '"\(.status) (\(.error // .note // "no reason"))"' <<< "$progress"), so it runs here."
                  finished=true
                  exit 0
                  ;;
              esac
            elif [ $((SECONDS - last_ok)) -ge "$SILENCE_SECONDS" ]; then
              echo "::warning::Lost contact with beefcake, so the review runs here."
              exit 0
            fi
            sleep 5
          done
          echo "::warning::The beefcake review took longer than $((FOLLOW_SECONDS / 60)) minutes, so it runs here."

      - name: Leave the tailnet
        if: steps.tailnet.outcome != 'skipped' && steps.follow.outputs.done != 'true'
        continue-on-error: true
        run: sudo tailscale logout

      # The cloud review posts with the beefcake GitHub App when this mint
      # succeeds. An empty github_token makes claude-code-action exchange an
      # OIDC token for claude[bot]. Missing secrets, an empty private key, or a
      # mint API error must not fail the job: continue into the Claude review
      # attempts with an empty github_token. Mint after the beefcake follow so a
      # long follow does not use up the installation token, which expires after
      # one hour.
      - name: Mint the beefcake token
        id: app-token
        if: steps.follow.outputs.done != 'true'
        continue-on-error: true
        env:
          APP_ID: ${{ secrets.BEEFCAKE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.BEEFCAKE_APP_PRIVATE_KEY }}
        run: |
          python3 - << 'PY'
          import base64
          import json
          import os
          import subprocess
          import tempfile
          import time
          import urllib.error
          import urllib.request

          app_id = os.environ.get("APP_ID", "").strip()
          private_key = os.environ.get("APP_PRIVATE_KEY", "")
          if "\n" not in private_key and "\\n" in private_key:
              private_key = private_key.replace("\\n", "\n")

          if not app_id or not private_key.strip():
              raise SystemExit(
                  "Cloud review needs secrets BEEFCAKE_APP_ID and BEEFCAKE_APP_PRIVATE_KEY. "
                  "Pass them from the caller. Create them as organization Actions secrets "
                  "for the foxglove org. Do not paste the private key into a pull request or a log."
              )
          if not app_id.isdigit():
              raise SystemExit("BEEFCAKE_APP_ID must be the numeric GitHub App id.")

          def b64(data):
              return base64.urlsafe_b64encode(data).rstrip(b"=").decode()

          header = b64(json.dumps({"alg": "RS256", "typ": "JWT"}, separators=(",", ":")).encode())
          now = int(time.time())
          payload = b64(
              json.dumps(
                  {"iat": now - 60, "exp": now + 540, "iss": app_id},
                  separators=(",", ":"),
              ).encode()
          )
          signing_input = f"{header}.{payload}".encode()
          key_file = tempfile.NamedTemporaryFile("w", delete=False)
          try:
              key_file.write(private_key if private_key.endswith("\n") else private_key + "\n")
              key_file.close()
              os.chmod(key_file.name, 0o600)
              signature = subprocess.check_output(
                  ["openssl", "dgst", "-sha256", "-sign", key_file.name],
                  input=signing_input,
              )
          except subprocess.CalledProcessError:
              raise SystemExit(
                  "Could not sign the GitHub App JWT. Check that BEEFCAKE_APP_PRIVATE_KEY is a PEM private key."
              )
          finally:
              try:
                  os.remove(key_file.name)
              except OSError:
                  pass

          jwt = f"{header}.{payload}.{b64(signature)}"
          print(f"::add-mask::{jwt}")

          def github_json(method, url, body=None):
              data = None if body is None else json.dumps(body).encode()
              request = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {jwt}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2026-03-10",
                      "User-Agent": "foxglove-actions-review",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", "replace")[:500]
                  raise SystemExit(f"GitHub {method} {url.split('?')[0]} failed: {error.code} {detail}")

          repository = os.environ["GITHUB_REPOSITORY"]
          installation = github_json(
              "GET",
              f"https://api.github.com/repos/{repository}/installation",
          )
          installation_id = installation.get("id")
          if not installation_id:
              raise SystemExit("GitHub did not return an installation id for this repository.")

          token_payload = github_json(
              "POST",
              f"https://api.github.com/app/installations/{installation_id}/access_tokens",
              {
                  "permissions": {
                      "contents": "read",
                      "issues": "write",
                      "pull_requests": "write",
                  }
              },
          )
          token = token_payload.get("token") or ""
          if not token:
              raise SystemExit("GitHub did not return an installation token.")
          print(f"::add-mask::{token}")
          delimiter = "BEEFCAKE_TOKEN_END"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"token<<{delimiter}\n{token}\n{delimiter}\n")
          PY

      - name: Checkout project repository
        if: steps.follow.outputs.done != 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout workflow repository
        if: steps.follow.outputs.done != 'true' || steps.follow.outputs.posted == 'true'
        uses: actions/checkout@v6
        with:
          repository: foxglove/actions
          path: .foxglove-actions
          ref: ${{ github.repository == 'foxglove/actions' && github.sha || 'main' }}

      # Give the reviewer a working JS runtime so it can check claims by running them instead of
      # reasoning from the spec. Dependencies are deliberately not installed: most reviews never
      # need them, and the reviewer can run `yarn install` itself on the rare one that does.
      # Both steps are best-effort, because the retry ladder below exists so reviews never go
      # dark and a setup step must not be able to fail the job before Claude starts. The
      # tradeoff is that a failed setup leaves the image's Node on PATH with nothing announcing
      # it, so a version-sensitive claim could be checked against the wrong major.
      #
      # Node is set up before Corepack so the shims land in the pinned install rather than the
      # image's. `cache: yarn` is omitted: the restore is a fixed cost on every review to save
      # roughly three times as much on the rare one that installs, and its post-step writes
      # under a lockfile-keyed name CI restores from, which a partial node_modules would poison.
      - name: Set up Node
        if: steps.follow.outputs.done != 'true' && hashFiles('.node-version', '.nvmrc') != ''
        continue-on-error: true
        uses: actions/setup-node@v6
        with:
          node-version-file: ${{ hashFiles('.node-version') != '' && '.node-version' || '.nvmrc' }}

      - name: Enable Corepack
        if: steps.follow.outputs.done != 'true' && hashFiles('yarn.lock') != ''
        continue-on-error: true
        run: corepack enable

      - name: Build Claude inputs
        id: claude-inputs
        if: steps.follow.outputs.done != 'true'
        env:
          REVIEW_BOT_LOGIN: ${{ steps.app-token.outcome == 'failure' && 'claude[bot]' || 'foxglove-beefcake[bot]' }}
        shell: bash
        run: |
          prompt_file=".foxglove-actions/prompts/review.md"
          if [ ! -f "$prompt_file" ]; then
            echo "Missing required review prompt file: $prompt_file" >&2
            exit 1
          fi

          # Deterministically discover repo-specific review instruction files.
          # git ls-files only lists tracked, first-party paths.
          # ':(icase)' makes matching case-insensitive; anchoring each basename
          # (root + '*/name') avoids matching decoys like 'NOTAGENTS.md'.
          instruction_files="$(git ls-files -- \
            ':(icase)AGENTS.md' ':(icase)*/AGENTS.md' \
            ':(icase)REVIEWING.md' ':(icase)*/REVIEWING.md' | sort)"

          {
            echo "prompt<<__CLAUDE_PROMPT__"
            echo "CONTEXT:"
            echo "  repo: ${{ github.repository }}"
            echo "  pr_number: ${{ github.event.pull_request.number }}"
            echo "  base_branch: ${{ github.event.pull_request.base.ref }}"
            echo "  is_draft: ${{ github.event.pull_request.draft }}"
            echo "  bot_login: ${REVIEW_BOT_LOGIN}"
            echo "  own_thread_logins: foxglove-beefcake[bot], claude[bot]"
            echo "  When the review instructions say CONTEXT.bot_login, post new reviews as ${REVIEW_BOT_LOGIN}."
            echo "  Treat threads and review comments from own_thread_logins as your own for reply, resolve, and minimize."
            if [ "$REVIEW_BOT_LOGIN" = "claude[bot]" ]; then
              echo "  Do not post a new review as foxglove-beefcake[bot]."
            else
              echo "  Do not post a new review as claude[bot]."
            fi
            echo "  repo_instruction_files:"
            if [ -n "$instruction_files" ]; then
              echo "$instruction_files" | sed 's/^/    - /'
            else
              echo "    []"
            fi
            echo
            cat "$prompt_file"
            echo "__CLAUDE_PROMPT__"

            echo "claude_args<<__CLAUDE_ARGS__"
            echo "--model claude-opus-5-5"
            echo "--effort high"
            # Passed as flag settings rather than the action's `settings` input, which writes
            # user settings that a reviewed repo's .claude/settings.json could override.
            echo "--settings '{\"outputStyle\":\"Concise\"}'"
            echo "--allowedTools \"${CLAUDE_ALLOWED_TOOLS}\""
            echo "__CLAUDE_ARGS__"
          } >> "$GITHUB_OUTPUT"

      - name: Clean up prior reviews (before attempt 1)
        if: steps.follow.outputs.done != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outcome == 'success' && steps.app-token.outputs.token || github.token }}
          script: |
            const cleanupPendingReviews = require(
              `${process.env.GITHUB_WORKSPACE}/.foxglove-actions/.github/scripts/cleanup-pending-reviews.js`,
            );
            await cleanupPendingReviews({ github, context, core });

      - name: Run Claude review (attempt 1)
        id: attempt1
        if: steps.follow.outputs.done != 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@9ca9355b36297178e28d37c799d1c9c8a28e6507 # Claude Code 2.1.280, Agent SDK 0.3.280 (after v1.0.231)
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outcome == 'success' && steps.app-token.outputs.token || '' }}
          bot_id: ${{ steps.app-token.outcome == 'success' && '342178988' || '41898282' }}
          bot_name: ${{ steps.app-token.outcome == 'success' && 'foxglove-beefcake[bot]' || 'claude[bot]' }}
          include_fix_links: "false"
          track_progress: false
          use_sticky_comment: false
          allowed_bots: cursor[bot]

          prompt: ${{ steps.claude-inputs.outputs.prompt }}
          claude_args: ${{ steps.claude-inputs.outputs.claude_args }}

      - name: Clean up prior reviews (before attempt 2)
        if: steps.attempt1.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outcome == 'success' && steps.app-token.outputs.token || github.token }}
          script: |
            const cleanupPendingReviews = require(
              `${process.env.GITHUB_WORKSPACE}/.foxglove-actions/.github/scripts/cleanup-pending-reviews.js`,
            );
            await cleanupPendingReviews({ github, context, core });

      - name: Run Claude review (attempt 2)
        id: attempt2
        if: steps.attempt1.outcome == 'failure'
        continue-on-error: true
        uses: anthropics/claude-code-action@9ca9355b36297178e28d37c799d1c9c8a28e6507 # Claude Code 2.1.280, Agent SDK 0.3.280 (after v1.0.231)
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outcome == 'success' && steps.app-token.outputs.token || '' }}
          bot_id: ${{ steps.app-token.outcome == 'success' && '342178988' || '41898282' }}
          bot_name: ${{ steps.app-token.outcome == 'success' && 'foxglove-beefcake[bot]' || 'claude[bot]' }}
          include_fix_links: "false"
          track_progress: false
          use_sticky_comment: false
          allowed_bots: cursor[bot]

          prompt: ${{ steps.claude-inputs.outputs.prompt }}
          claude_args: ${{ steps.claude-inputs.outputs.claude_args }}

      - name: Clean up prior reviews (before attempt 3)
        if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outcome == 'success' && steps.app-token.outputs.token || github.token }}
          script: |
            const cleanupPendingReviews = require(
              `${process.env.GITHUB_WORKSPACE}/.foxglove-actions/.github/scripts/cleanup-pending-reviews.js`,
            );
            await cleanupPendingReviews({ github, context, core });

      - name: Run Claude review (attempt 3)
        id: attempt3
        if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
        continue-on-error: true
        uses: anthropics/claude-code-action@9ca9355b36297178e28d37c799d1c9c8a28e6507 # Claude Code 2.1.280, Agent SDK 0.3.280 (after v1.0.231)
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outcome == 'success' && steps.app-token.outputs.token || '' }}
          bot_id: ${{ steps.app-token.outcome == 'success' && '342178988' || '41898282' }}
          bot_name: ${{ steps.app-token.outcome == 'success' && 'foxglove-beefcake[bot]' || 'claude[bot]' }}
          include_fix_links: "false"
          track_progress: false
          use_sticky_comment: false
          allowed_bots: cursor[bot]

          prompt: ${{ steps.claude-inputs.outputs.prompt }}
          claude_args: ${{ steps.claude-inputs.outputs.claude_args }}

      - name: Verify success
        if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure' && steps.attempt3.outcome == 'failure'
        run: |
          echo "Review failed after 3 attempts."
          exit 1

      # The follow step uses continue-on-error, so a failure there does not fail the job.
      # This step does not. Exit 1 for a Blocker or Should fix comment, or for an
      # unresolved thread that starts with one of those labels. A nit does not fail
      # the job. GitHub then reports the review / beefcake check as failed.
      - name: Fail on a blocker or should-fix
        if: >-
          steps.follow.outputs.posted == 'true' ||
          steps.attempt1.outcome == 'success' ||
          steps.attempt2.outcome == 'success' ||
          steps.attempt3.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BOT_LOGIN: ${{ steps.app-token.outcome == 'failure' && 'claude[bot]' || 'foxglove-beefcake[bot]' }}
        run: |
          set -euo pipefail
          script=".foxglove-actions/.github/scripts/review-verdict.py"
          if [ ! -f "$script" ]; then
            echo "Missing review verdict script: $script" >&2
            exit 1
          fi
          jobs_file="$(mktemp)"
          reviews_file="$(mktemp)"
          comments_file="$(mktemp)"
          threads_file="$(mktemp)"
          trap 'rm -f "$jobs_file" "$reviews_file" "$comments_file" "$threads_file"' EXIT
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" > "$jobs_file"
          owner="${GITHUB_REPOSITORY%%/*}"
          repo_name="${GITHUB_REPOSITORY#*/}"
          thread_query="$(cat <<'GRAPHQL'
          query($owner:String!, $name:String!, $number:Int!, $cursor:String) {
            repository(owner:$owner, name:$name) {
              pullRequest(number:$number) {
                reviewThreads(first:100, after:$cursor) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    isResolved
                    comments(first:1) {
                      nodes { author { login } body }
                    }
                  }
                }
              }
            }
          }
          GRAPHQL
          )"
          attempt=1
          while [ "$attempt" -le 6 ]; do
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" > "$reviews_file"
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/comments?per_page=100" > "$comments_file"
            threads='[]'
            cursor=""
            page_number=0
            while [ "$page_number" -lt 10 ]; do
              if [ -z "$cursor" ]; then
                page="$(gh api graphql -f query="$thread_query" -f owner="$owner" -f name="$repo_name" -F number="$PR_NUMBER")"
              else
                page="$(gh api graphql -f query="$thread_query" -f owner="$owner" -f name="$repo_name" -F number="$PR_NUMBER" -f cursor="$cursor")"
              fi
              if jq -e '(.errors // []) | length > 0' >/dev/null <<< "$page"; then
                echo "Could not read review threads." >&2
                jq -r '.errors[]?.message' <<< "$page" >&2
                exit 1
              fi
              nodes="$(jq -c '.data.repository.pullRequest.reviewThreads.nodes // []' <<< "$page")"
              threads="$(jq -c --argjson nodes "$nodes" '. + $nodes' <<< "$threads")"
              has_next="$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage' <<< "$page")"
              if [ "$has_next" != "true" ]; then
                break
              fi
              cursor="$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.endCursor // empty' <<< "$page")"
              page_number=$((page_number + 1))
            done
            printf '%s\n' "$threads" > "$threads_file"
            set +e
            message="$(python3 "$script" \
              --jobs "$jobs_file" \
              --job-name "$GITHUB_JOB" \
              --reviews "$reviews_file" \
              --comments "$comments_file" \
              --threads "$threads_file" \
              --head-sha "$HEAD_SHA" \
              --bot "$BOT_LOGIN" 2>&1)"
            status=$?
            set -e
            echo "$message"
            if [ "$status" -eq 0 ]; then
              echo "$message" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$status" -ne 2 ] || [ "$attempt" -eq 6 ]; then
              echo "$message" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "The review is not on this commit yet. Waiting."
            attempt=$((attempt + 1))
            sleep 5
          done
          exit 1
