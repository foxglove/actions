name: Checkov Helm

on:
  workflow_call:
    inputs:
      layout:
        description: "Helm target layout: sibling (charts/*/chart + charts/*/targets) or shared (chart_dirs + targets_dir)"
        type: string
        required: true
      charts_root:
        description: Root directory for sibling layout (e.g. charts)
        type: string
        required: false
        default: charts
      chart_dirs:
        description: Comma-separated chart directories for shared layout (e.g. deploy/api,deploy/billing)
        type: string
        required: false
        default: ""
      targets_dir:
        description: Shared values directory for shared layout (e.g. deploy/targets)
        type: string
        required: false
        default: ""
      actions_ref:
        description: foxglove/actions git ref to check out for scripts/config (use the same full SHA as uses:)
        type: string
        required: false
        default: main
      config_file:
        description: Optional path to a consumer checkov.yml (replaces shared defaults when non-comment content exists)
        type: string
        required: false
        default: ""
      soft_fail:
        description: Do not fail the job when Checkov finds issues
        type: boolean
        required: false
        default: true
      upload_sarif:
        description: Upload SARIF to GitHub Code Scanning (requires Code Security on private repos)
        type: boolean
        required: false
        default: false
      skip_path:
        description: Optional comma-separated paths to skip
        type: string
        required: false
        default: ""
      helm_set:
        description: Optional comma-separated helm --set pairs applied to every render (e.g. imageHash=checkov-placeholder)
        type: string
        required: false
        default: ""
      artifact_suffix:
        description: Suffix for the uploaded artifact name (required to be unique if this workflow is called more than once)
        type: string
        required: false
        default: default

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  checkov-helm:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout consumer repository
        uses: actions/checkout@v6

      - name: Checkout foxglove/actions
        uses: actions/checkout@v6
        with:
          repository: foxglove/actions
          path: .foxglove-actions
          ref: ${{ github.repository == 'foxglove/actions' && github.sha || inputs.actions_ref }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Resolve Checkov config
        id: config
        shell: bash
        env:
          CONFIG_FILE: ${{ inputs.config_file }}
        run: |
          bash .foxglove-actions/.github/scripts/resolve-checkov-config.sh \
            "${CONFIG_FILE}" \
            ".foxglove-actions/checkov/checkov.yml" \
            "checkov.yml"

      - name: Render Helm charts with target values
        id: render
        shell: bash
        env:
          LAYOUT: ${{ inputs.layout }}
          CHARTS_ROOT: ${{ inputs.charts_root }}
          CHART_DIRS: ${{ inputs.chart_dirs }}
          TARGETS_DIR: ${{ inputs.targets_dir }}
          HELM_SET: ${{ inputs.helm_set }}
          SOFT_FAIL: ${{ inputs.soft_fail }}
        run: |
          case "${LAYOUT}" in
            sibling)
              bash .foxglove-actions/.github/scripts/render-helm-targets.sh \
                sibling checkov-rendered "${CHARTS_ROOT}"
              ;;
            shared)
              bash .foxglove-actions/.github/scripts/render-helm-targets.sh \
                shared checkov-rendered "${CHART_DIRS}" "${TARGETS_DIR}"
              ;;
            *)
              echo "Invalid layout '${LAYOUT}' (expected sibling or shared)" >&2
              exit 1
              ;;
          esac

      - name: Run Checkov (Kubernetes manifests)
        id: checkov
        uses: bridgecrewio/checkov-action@v12.1347.0
        with:
          directory: checkov-rendered
          framework: kubernetes
          soft_fail: ${{ inputs.soft_fail }}
          quiet: true
          skip_results_upload: true
          skip_download: true
          config_file: ${{ steps.config.outputs.config_file }}
          skip_path: ${{ inputs.skip_path }}
          output_format: cli,sarif,json
          output_file_path: console,checkov-helm.sarif,checkov-helm.json

      - name: Summarize results
        if: success() || failure()
        shell: bash
        env:
          LAYOUT: ${{ inputs.layout }}
          SOFT_FAIL: ${{ inputs.soft_fail }}
        run: |
          {
            echo "## Checkov Helm (rendered targets → kubernetes)"
            echo
            echo "- Layout: \`${LAYOUT}\`"
            echo "- Soft fail: \`${SOFT_FAIL}\`"
            if [[ -f checkov-helm.json ]]; then
              failed="$(jq '[.. | .failed_checks? // empty | length] | add // 0' checkov-helm.json 2>/dev/null || echo unknown)"
              passed="$(jq '[.. | .passed_checks? // empty | length] | add // 0' checkov-helm.json 2>/dev/null || echo unknown)"
              echo "- Failed checks: **${failed}**"
              echo "- Passed checks: **${passed}**"
            else
              echo "- Result files were not produced; see job logs."
            fi
            echo
            echo "SARIF/JSON are workflow artifacts only. Code Scanning upload requires \`upload_sarif: true\` and Code Security."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Checkov artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-helm-${{ inputs.artifact_suffix }}
          path: |
            checkov-helm.sarif
            checkov-helm.json
          if-no-files-found: warn

      - name: Upload SARIF to Code Scanning
        if: ${{ (success() || failure()) && inputs.upload_sarif }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-helm.sarif
          category: checkov-helm
