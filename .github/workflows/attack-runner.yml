name: Attack Runner

on:
  pull_request:
    paths:
      - ".github/workflows/attack-runner.yml"
      - ".node-version"
      - "docs/aegis/review/offline-planner.md"
      - "package.json"
      - "src/attack-runner/**"
      - "test/attack-runner/**"
      - "yarn.lock"

permissions:
  contents: read

jobs:
  offline-planner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install packages
        run: yarn install --immutable

      - name: Check format
        run: yarn format:check

      - name: Test the offline planner
        run: yarn test:attack-runner
