name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: read
  pull-requests: write
  id-token: write

jobs:
  review:
    permissions:
      actions: read
      contents: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/review.yml
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
