name: Dependency scan

on:
  push:
    branches: [main]
    paths:
      - "yarn.lock"
      - ".github/workflows/dependency-scan.yml"
      - ".github/workflows/dependencies.yml"
  pull_request:
    paths:
      - "yarn.lock"
      - ".github/workflows/dependency-scan.yml"
      - ".github/workflows/dependencies.yml"
  schedule:
    # Monday 09:17 UTC. GitHub runs this only from the default branch.
    - cron: "17 9 * * 1"
  workflow_dispatch:

# A new commit cancels the previous scan of the same PR, or of main. Other PRs are separate groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  # yarn.lock lists only the devDependency prettier. Dev dependencies are
  # excluded, so a package count of zero is expected on this caller.
  dependency-scan:
    uses: ./.github/workflows/dependency-scan.yml
    with:
      lockfiles: yarn.lock
      soft_fail: true
