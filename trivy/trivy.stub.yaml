# Per-repo Trivy config.
# When any non-comment key is set, this file REPLACES the shared defaults from
# foxglove/actions (trivy/trivy.yaml). Keys are not merged — copy any shared
# settings you still want into this file.
#
# Docs: https://github.com/foxglove/actions/blob/main/docs/trivy-image.md
#
# severity and ignore-unfixed have no effect in this file. The workflow passes
# those as CLI flags. Set the severity and ignore_unfixed workflow inputs.
#
# Vulnerability IDs to skip belong in .trivyignore (or the ignore_file input),
# not in this file. Example .trivyignore line:
#
# CVE-2024-00000
#
# Keys the workflow does not override:
#
# db:
#   repository:
#     - mirror.gcr.io/aquasec/trivy-db:2
#
# vulnerability:
#   vex:
#     - path/to/vex.json
